
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Garden Gnome</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#142638;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 5px #234;font-weight:bold}
.panel{background:#142638bb;padding:9px 13px;border-radius:12px;line-height:1.6}
#chargeWrap{position:fixed;bottom:23px;left:10%;width:80%;height:16px;border:2px solid white;border-radius:20px;background:#2238;overflow:hidden;pointer-events:none}
#charge{height:100%;width:0;background:linear-gradient(90deg,#5de5ff,#ffe45d,#ff713e);border-radius:20px}
#message{position:fixed;bottom:49px;width:100%;text-align:center;text-shadow:0 2px 5px #234;font-weight:bold;pointer-events:none}
#menu{position:fixed;inset:0;background:#102538ee;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px}
#menu h1{font-size:34px;margin:0}
#characters{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.char{font-size:30px;padding:10px;border:2px solid #789;border-radius:14px;background:#ffffff18}
.char.selected{border-color:#ffe45d;background:#ffe45d33}
button{border:0;border-radius:13px;padding:13px 25px;background:#ffd84d;color:#243044;font-weight:bold;font-size:17px}
.small{font-size:13px;color:#c7d8e5;text-align:center;max-width:300px;line-height:1.7}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="panel">距離 <span id="distance">0</span> m<br>最高記録 <span id="best">0</span> m</div>
 <div class="panel">プレイ回数 <span id="plays">0</span><br><span id="world">🌳 地上</span></div>
</div>
<div id="message">画面を長押ししてパワーをためよう！</div>
<div id="chargeWrap"><div id="charge"></div></div>
<div id="menu">
 <h1>🍄 Garden Gnome</h1>
 <div>ノームを選ぼう！</div>
 <div id="characters">
  <button class="char selected" data-char="0">🧙</button>
  <button class="char" data-char="1">🧝</button>
  <button class="char" data-char="2">🎅</button>
  <button class="char" data-char="3">🧑‍🌾</button>
  <button class="char" data-char="4">🧙‍♂️</button>
 </div>
 <div class="small">最初は長押しで発射！<br>飛行中にタップ・スペースで急降下！</div>
 <button id="start">ゲームスタート</button>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
 W=innerWidth;H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

const emojis=["🧙","🧝","🎅","🧑‍🌾","🧙‍♂️"];
const rand=(a,b)=>a+Math.random()*(b-a);

let selected=0;
document.querySelectorAll(".char").forEach(b=>{
 b.onclick=()=>{
  selected=+b.dataset.char;
  document.querySelectorAll(".char").forEach(x=>{
   x.classList.toggle("selected",x===b);
  });
 };
});

let best=+(localStorage.gnomeBest||0);
let plays=+(localStorage.gnomePlays||0);
document.getElementById("best").textContent=best;
document.getElementById("plays").textContent=plays;

let player;
let objects=[];
let pipes=[];
let muds=[];
let particles=[];
let generatedUntil=0;

let groundY=0;
let cameraX=0;
let cameraY=0;
let playing=false;
let charging=false;
let charge=0;
let last=0;
let distance=0;
let space=false;
let cloudTime=0;
let diveUsed=false;
let transporting=false;
let transportTimer=0;
let transportExitX=0;
let stopped=false;
let stopTimer=0;

const CHUNK=1100;

function reset(){
 groundY=H*.76;
 player={
  x:100,y:groundY-24,
  vx:0,vy:0,
  angle:0,spin:0,
  r:18,
  launched:false,
  diving:false,
  grounded:true
 };
 objects=[];
 pipes=[];
 muds=[];
 particles=[];
 generatedUntil=0;
 cameraX=0;
 cameraY=0;
 distance=0;
 space=false;
 cloudTime=0;
 diveUsed=false;
 transporting=false;
 stopped=false;
 stopTimer=0;
 charge=0;
 charging=false;

 generateWorld(0);
}

function generateWorld(target){
 while(generatedUntil<target+CHUNK*2){
  let start=generatedUntil;
  let end=start+CHUNK;

  // キノコをランダム配置
  for(let i=0;i<7;i++){
   let x=rand(start+100,end-80);
   let mega=Math.random()<.16;
   objects.push({
    x,y:groundY-14,
    type:mega?"mega":"mush",
    r:mega?31:rand(16,21),
    hit:false
   });
  }

  // 雲
  if(Math.random()<.8){
   objects.push({
    x:rand(start+150,end-100),
    y:groundY-rand(H*1.1,H*2.8),
    type:"cloud",
    r:rand(45,85),
    hit:false
   });
  }

  // 泥エリア
  if(Math.random()<.35){
   muds.push({
    x:rand(start+200,end-220),
    w:rand(100,190),
    y:groundY
   });
  }

  // 土管
  if(Math.random()<.38){
   let x=rand(start+250,end-180);
   pipes.push({
    x,y:groundY-58,
    w:66,h:58,
    used:false
   });
  }

  generatedUntil=end;
 }
}

function start(){
 document.getElementById("menu").style.display="none";
 plays++;
 localStorage.gnomePlays=plays;
 document.getElementById("plays").textContent=plays;
 reset();
 playing=true;
 last=performance.now();
 requestAnimationFrame(loop);
}
document.getElementById("start").onclick=start;

function burst(x,y,n,color){
 for(let i=0;i<n;i++){
  let a=rand(0,Math.PI*2);
  let s=rand(2,11);
  particles.push({
   x,y,
   vx:Math.cos(a)*s,
   vy:Math.sin(a)*s,
   life:rand(25,65),
   color,
   size:rand(3,8)
  });
 }
}

function beginCharge(){
 if(!playing||player.launched||transporting||stopped)return;
 charging=true;
 charge=0;
}
function releaseCharge(){
 if(!charging||!playing||player.launched)return;
 charging=false;
 let power=Math.min(charge,1);
 player.vx=8+power*15;
 player.vy=-7-power*10;
 player.launched=true;
 player.grounded=false;
 player.spin=.2;
 burst(player.x,player.y,25,"#fff1a6");
 document.getElementById("message").textContent="飛んでいるよ！タップで急降下！";
 document.getElementById("charge").style.width="0%";
}

function dive(){
 if(!playing||!player.launched||diveUsed||transporting||stopped)return;
 diveUsed=true;
 player.diving=true;
 player.vy=Math.max(player.vy,0)+19;
 player.vx*=1.12;
 player.spin+=.45;
 burst(player.x,player.y,16,"#e8f8ff");
 document.getElementById("message").textContent="⬇ 急降下！！";
}

canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(!playing)return;
 if(!player.launched)beginCharge();
 else dive();
});
addEventListener("pointerup",releaseCharge);
addEventListener("pointercancel",releaseCharge);

let keyDown=false;
addEventListener("keydown",e=>{
 if(e.code==="Space"&&!keyDown){
  e.preventDefault();
  keyDown=true;
  if(!playing)return;
  if(!player.launched)beginCharge();
  else dive();
 }
});
addEventListener("keyup",e=>{
 if(e.code==="Space"){
  keyDown=false;
  releaseCharge();
 }
});

function finish(){
 if(!playing)return;
 playing=false;
 charging=false;
 document.getElementById("charge").style.width="0%";
 document.getElementById("message").textContent="記録 "+distance+" m！";
 setTimeout(()=>{
  document.getElementById("menu").style.display="flex";
  document.getElementById("message").textContent="画面を長押ししてパワーをためよう！";
 },1400);
}

// 土管に入る
function enterPipe(pipe){
 if(pipe.used||transporting)return;
 pipe.used=true;
 transporting=true;
 transportTimer=0;

 transportExitX=pipe.x+rand(650,950);

 player.x=pipe.x+pipe.w/2;
 player.y=pipe.y+pipe.h/2;
 player.vx=0;
 player.vy=0;
 player.spin=0;

 burst(player.x,player.y,30,"#8cff8c");
 document.getElementById("message").textContent="🟢 土管の中を移動中...";
}

// 土管から大ジャンプ
function exitPipe(){
 player.x=transportExitX;
 player.y=groundY-145;

 // 強力な斜め上方向の発射
 player.vx=rand(27,33);
 player.vy=-rand(27,34);

 player.angle=-.8;
 player.spin=.55;
 player.grounded=false;
 player.diving=false;
 player.launched=true;

 diveUsed=false;
 stopped=false;
 transporting=false;
 cloudTime=0;

 burst(player.x,player.y,90,"#7cff9c");
 burst(player.x,player.y,55,"#ffffff");

 document.getElementById("message").textContent="🚀 土管スーパー発射！！";
}

function inMud(x){
 return muds.find(m=>x>=m.x&&x<=m.x+m.w);
}

function update(dt){
 let p=player;
 let step=Math.min(dt,35)/16.67;

 if(charging&&!p.launched){
  charge=Math.min(1,charge+step*.012);
  document.getElementById("charge").style.width=(charge*100)+"%";
 }

 if(transporting){
  transportTimer+=dt;
  if(transportTimer>=900)exitPipe();
  return;
 }

 if(stopped){
  stopTimer+=dt;
  if(stopTimer>1300)finish();
  return;
 }

 if(!p.launched)return;

 // 空中の物理
 p.vy+=.34*step;

 if(cloudTime>0){
  p.vy-=.27*step;
  cloudTime-=dt;
 }

 p.vx=Math.max(-4,Math.min(34,p.vx));
 p.vy=Math.max(-32,Math.min(35,p.vy));

 // 位置更新
 p.x+=p.vx*step;
 p.y+=p.vy*step;

 // 回転
 p.angle+=p.spin*step;
 p.spin*=Math.pow(.995,step);

 // 先の世界を自動生成
 generateWorld(p.x);

 // 雲
 for(const o of objects){
  if(o.hit||o.type!=="cloud")continue;
  if(Math.abs(p.x-o.x)>100)continue;

  let dx=p.x-o.x;
  let dy=p.y-o.y;
  if(Math.hypot(dx,dy)<o.r+p.r){
   o.hit=true;
   cloudTime=2600;
   p.vy=Math.min(p.vy,-3);
   burst(o.x,o.y,45,"#ffffff");
   document.getElementById("message").textContent="☁️ 雲の上をふわふわ！";
  }
 }

 // キノコ衝突
 for(const o of objects){
  if(o.hit||o.type==="cloud")continue;
  if(Math.abs(p.x-o.x)>90)continue;

  let dx=p.x-o.x;
  let dy=p.y-o.y;
  let d=Math.hypot(dx,dy);

  if(d<o.r+p.r){
   o.hit=true;
   let impact=Math.max(0,p.vy);

   if(o.type==="mega"){
    p.vy=-Math.max(24,impact*2.5+13);
    p.vx=Math.max(p.vx*1.55,24);
    p.spin+=.65;
    burst(o.x,o.y,120,"#ffd43b");
    burst(o.x,o.y,70,"#ffffff");
    document.getElementById("message").textContent="⭐ MEGA MUSHROOM！！";
   }else{
    p.vy=-Math.max(14,impact*2.05+10);
    p.vx=Math.max(p.vx*1.15,11+impact*.45);
    p.spin+=.42;
    burst(o.x,o.y,35,"#ff6584");
    document.getElementById("message").textContent="🍄 超ジャンプ！！";
   }

   p.diving=false;
   p.grounded=false;
   diveUsed=false;
  }
 }

 // 地面との衝突
 let floor=groundY-p.r;

 if(p.y>=floor&&p.vy>=0){
  p.y=floor;
  p.grounded=true;

  let mud=inMud(p.x);

  if(mud){
   // 泥は強い抵抗で完全停止
   p.vy=0;
   p.vx*=Math.pow(.65,step);
   p.spin*=Math.pow(.5,step);
   p.diving=false;

   if(Math.abs(p.vx)<.22){
    p.vx=0;
    p.vy=0;
    p.spin=0;
    stopped=true;
    stopTimer=0;
    document.getElementById("message").textContent="🟤 泥でピタッと停止！";
   }else{
    document.getElementById("message").textContent="🟤 泥で減速中...";
   }
  }else{
   // 通常地面の反発
   if(p.vy>2.5){
    p.vy=-p.vy*.28;
    p.vx*=.94;
    p.spin+=.2;
    p.grounded=false;
   }else{
    p.vy=0;
    p.vx*=Math.pow(.988,step);
    p.spin*=.8;
   }
   p.diving=false;
   if(Math.abs(p.vy)<2)diveUsed=false;
  }
 }

 // 土管に転がり込む
 for(const pipe of pipes){
  if(pipe.used||transporting)continue;
  if(Math.abs(p.x-pipe.x)>95)continue;

  let near=p.x>pipe.x-20&&p.x<pipe.x+pipe.w+20;
  let low=p.y>groundY-90;

  if(near&&low&&p.vx>3){
   enterPipe(pipe);
   break;
  }
 }

 // カメラ追従
 cameraX=Math.max(0,p.x-W*.34);
 cameraY=p.y-H*.48;

 distance=Math.max(0,Math.floor(p.x/10));
 document.getElementById("distance").textContent=distance;

 let isSpace=(groundY-p.y)>H*3;
 if(isSpace!==space){
  space=isSpace;
  document.getElementById("world").textContent=space?"🚀 宇宙":"🌳 地上";
 }

 if(distance>best){
  best=distance;
  localStorage.gnomeBest=best;
  document.getElementById("best").textContent=best;
 }
}

// 背景
function drawBackground(){
 if(space){
  ctx.fillStyle="#080c2c";
  ctx.fillRect(0,0,W,H);
  for(let i=0;i<120;i++){
   let x=((i*173-cameraX*.12)%W+W)%W;
   let y=((i*97-cameraY*.1)%H+H)%H;
   ctx.globalAlpha=.4+(i%5)*.12;
   ctx.fillStyle=i%4===0?"#ffe88a":"#fff";
   ctx.fillRect(x,y,2,2);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#a9b8ff";
  ctx.beginPath();
  ctx.arc(W*.78,H*.2,35,0,Math.PI*2);
  ctx.fill();
 }else{
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#69c6ee");
  g.addColorStop(1,"#e2f7d4");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<9;i++){
   let x=((i*260-cameraX*.25)%(W+300)+W+300)%(W+300)-100;
   let y=90+i%3*80;
   ctx.fillStyle="#ffffff66";
   ctx.beginPath();
   ctx.arc(x,y,35,0,Math.PI*2);
   ctx.arc(x+35,y-5,45,0,Math.PI*2);
   ctx.arc(x+75,y+10,30,0,Math.PI*2);
   ctx.fill();
  }
 }
}

// 地面
function drawGround(){
 let gy=groundY-cameraY;
 if(gy<H+100&&gy>-100){
  ctx.fillStyle=space?"#30334b":"#4b9a46";
  ctx.fillRect(0,gy,W,H-gy+200);
  ctx.fillStyle=space?"#8588a0":"#8bcf5d";
  ctx.fillRect(0,gy,W,8);
 }

 // 泥
 for(const m of muds){
  let x=m.x-cameraX;
  let y=m.y-cameraY;
  if(x+m.w<-10||x>W+10)continue;

  ctx.fillStyle="#60432f";
  ctx.beginPath();
  ctx.roundRect(x,y-5,m.w,17,7);
  ctx.fill();

  ctx.fillStyle="#876044";
  for(let i=0;i<6;i++){
   ctx.beginPath();
   ctx.arc(x+12+i*m.w/6,y+1,5,0,Math.PI*2);
   ctx.fill();
  }

  ctx.fillStyle="#b58a62";
  ctx.fillRect(x+5,y-4,m.w-10,3);
 }
}

// キノコ
function drawMushroom(o,x,y){
 ctx.save();
 ctx.translate(x,y);
 ctx.fillStyle="#f5e5cf";
 ctx.fillRect(-6,0,12,18);
 ctx.fillStyle="#e94360";
 ctx.beginPath();
 ctx.arc(0,0,o.r,Math.PI,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#fff";
 for(let i=-1;i<=1;i++){
  ctx.beginPath();
  ctx.arc(i*7,-8,3,0,Math.PI*2);
  ctx.fill();
 }
 ctx.restore();
}

// 巨大キノコ
function drawMega(o,x,y){
 ctx.save();
 ctx.translate(x,y);
 ctx.shadowColor="#ffe34e";
 ctx.shadowBlur=22;
 ctx.fillStyle="#ffda35";
 ctx.beginPath();
 ctx.arc(0,0,o.r,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;
 ctx.fillStyle="#b84739";
 ctx.beginPath();
 ctx.arc(0,-4,o.r*.9,Math.PI,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="white";
 ctx.font="22px Arial";
 ctx.textAlign="center";
 ctx.fillText("⭐",0,12);
 ctx.restore();
}

// 土管の描画
function drawPipe(pipe){
 let x=pipe.x-cameraX;
 let y=pipe.y-cameraY;
 let w=pipe.w;
 let h=pipe.h;
 if(x<-100||x>W+100)return;

 // 本体
 ctx.fillStyle="#087d37";
 ctx.fillRect(x+7,y+13,w-14,h-13);

 // 暗い側面
 ctx.fillStyle="#07552d";
 ctx.fillRect(x+w-17,y+13,9,h-13);

 // 明るい側面
 ctx.fillStyle="#20b653";
 ctx.fillRect(x+10,y+16,10,h-16);

 // 上部の厚い縁
 ctx.fillStyle="#087a34";
 ctx.fillRect(x,y,w,19);

 ctx.fillStyle="#25c75b";
 ctx.fillRect(x+3,y+2,w-6,7);

 // 入口の穴
 ctx.fillStyle="#063d26";
 ctx.beginPath();
 ctx.ellipse(x+w/2,y+10,w*.4,7,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111f20";
 ctx.beginPath();
 ctx.ellipse(x+w/2,y+10,w*.28,4,0,0,Math.PI*2);
 ctx.fill();

 // 下の縁
 ctx.fillStyle="#07552d";
 ctx.fillRect(x+7,y+h-5,w-14,5);
}

function drawWorld(){
 drawGround();

 for(const o of objects){
  let x=o.x-cameraX;
  let y=o.y-cameraY;
  if(x<-120||x>W+120||y<-150||y>H+150||o.hit)continue;

  if(o.type==="cloud"){
   ctx.fillStyle="#ffffffcc";
   ctx.beginPath();
   ctx.arc(x,y,o.r*.55,0,Math.PI*2);
   ctx.arc(x-o.r*.4,y+8,o.r*.4,0,Math.PI*2);
   ctx.arc(x+o.r*.4,y+7,o.r*.42,0,Math.PI*2);
   ctx.fill();
  }else if(o.type==="mega"){
   drawMega(o,x,y);
  }else{
   drawMushroom(o,x,y);
  }
 }

 for(const pipe of pipes)drawPipe(pipe);
}

function drawPlayer(){
 if(!player)return;
 let x=player.x-cameraX;
 let y=player.y-cameraY;

 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(player.angle);
 ctx.font="42px serif";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(emojis[selected],0,0);
 ctx.restore();
}

function drawParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];
  p.x+=p.vx*dt/16.67;
  p.y+=p.vy*dt/16.67;
  p.vy+=.12*dt/16.67;
  p.life-=dt/16.67;

  ctx.globalAlpha=Math.max(0,p.life/55);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x-cameraX,p.y-cameraY,p.size,0,Math.PI*2);
  ctx.fill();

  if(p.life<=0)particles.splice(i,1);
 }
 ctx.globalAlpha=1;
}

function render(dt){
 drawBackground();
 drawWorld();
 drawParticles(dt);
 drawPlayer();
}

function loop(now){
 if(!playing)return;
 let dt=Math.min(35,now-last||16);
 last=now;
 update(dt);
 render(dt);
 requestAnimationFrame(loop);
}

render(16);
</script>
</body>
</html>
