
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Garden Gnome Flight</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#172d28;color:white;
 font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;
 overflow:hidden;user-select:none;touch-action:manipulation
}
#game{
 display:block;width:100vw;height:100dvh;
 background:#91d9f2;touch-action:none
}
#top{
 position:absolute;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;gap:8px;
 pointer-events:none
}
.stat{
 background:#163c32e8;padding:9px 13px;
 border-radius:12px;font-size:12px;
 box-shadow:0 3px 8px #0004
}
.stat b{display:block;font-size:19px;color:#ffe18a;margin-top:3px}
#menu{
 position:absolute;inset:0;display:flex;
 flex-direction:column;align-items:center;
 justify-content:center;background:#17382bdc;
 padding:18px;overflow:auto
}
h1{font-size:32px;color:#ffe28a;text-shadow:0 3px 4px #0008;margin:0 0 8px}
.sub{color:#e0f4e8;margin-bottom:18px}
#characters{
 display:grid;grid-template-columns:repeat(3,minmax(80px,105px));
 gap:10px;margin:10px 0 18px
}
.character{
 border:2px solid #729b7c;border-radius:13px;
 background:#315d43;padding:10px 4px;
 text-align:center;cursor:pointer
}
.character.selected{border:3px solid #ffdc63;background:#557e43}
.character canvas{width:70px;height:75px}
.character span{display:block;font-size:12px}
button{
 border:0;border-radius:13px;padding:13px 25px;
 background:#ffcf52;color:#493016;
 font-weight:bold;font-size:17px;cursor:pointer;
 box-shadow:0 4px 0 #b47b24
}
#result{
 position:absolute;inset:0;display:none;
 align-items:center;justify-content:center;
 background:#142d27c9;padding:20px
}
.panel{
 background:#28523c;border:3px solid #a6c879;
 border-radius:20px;padding:24px;text-align:center;
 width:min(340px,95%)
}
.panel h2{color:#ffdf75}
.panel strong{font-size:35px;color:#ffe28a}
#hint{
 position:absolute;bottom:20px;left:0;right:0;
 text-align:center;color:white;
 text-shadow:0 2px 4px #000;font-weight:bold;
 pointer-events:none;font-size:14px
}
#back{
 position:absolute;bottom:12px;left:12px;
 padding:9px 13px;font-size:12px
}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
 <div class="stat">最高飛距離<b id="best">0 m</b></div>
 <div class="stat">プレイ回数<b id="plays">0 回</b></div>
 <div class="stat">今回の飛距離<b id="distance">0 m</b></div>
</div>

<div id="menu">
 <h1>🌼 Gnome Flight</h1>
 <div class="sub">ノームを飛ばして世界記録に挑戦！</div>
 <div>人形を選ぼう</div>
 <div id="characters"></div>
 <button id="start">ゲームスタート</button>
 <div style="font-size:12px;margin-top:15px;color:#d5e8d6">
 ゲーム画面をタップして発射！
 </div>
</div>

<div id="hint">画面をタップして発射！</div>
<button id="back" class="hidden">メニューへ</button>

<div id="result">
 <div class="panel">
  <h2 id="resultTitle">着地！</h2>
  <div>今回の飛距離</div>
  <strong id="finalDistance">0 m</strong>
  <p id="recordMessage"></p>
  <button id="again">もう一度！</button>
  <br><br>
  <button id="toMenu" style="background:#d7e7c9">人形選択へ</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight;
let dpr=Math.min(devicePixelRatio||1,2);

function resize(){
 W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const people=[
 {name:"赤帽子",hat:"#e94438",coat:"#d84c35",skin:"#ffd2a0"},
 {name:"青帽子",hat:"#328bd4",coat:"#3462a0",skin:"#f5c89b"},
 {name:"緑帽子",hat:"#48b75a",coat:"#397c43",skin:"#f5c89b"},
 {name:"紫帽子",hat:"#a36bd3",coat:"#7547a3",skin:"#eac09b"},
 {name:"黄色帽子",hat:"#f3ca3e",coat:"#d49b26",skin:"#ffd5a8"},
 {name:"黒帽子",hat:"#383b43",coat:"#52545a",skin:"#edc09b"}
];
let selected=0;
let state="menu";
let player=null;
let camera=0;
let distance=0;
let particles=[];
let scenery=[];
let flowers=[];
let shake=0;
let launchTime=0;
let last=0;
let best=Number(localStorage.getItem("gnomeBest")||0);
let plays=Number(localStorage.getItem("gnomePlays")||0);

const $=id=>document.getElementById(id);
function updateStats(){
 $("best").textContent=best+" m";
 $("plays").textContent=plays+" 回";
 $("distance").textContent=distance+" m";
}
updateStats();

function drawGnome(c,x,y,s=1,angle=0){
 ctx.save();
 ctx.translate(x,y);ctx.rotate(angle);ctx.scale(s,s);
 // 体
 ctx.fillStyle=c.coat;
 ctx.beginPath();ctx.ellipse(0,0,13,19,0,0,Math.PI*2);ctx.fill();
 // 足
 ctx.strokeStyle="#493627";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(-6,14);ctx.lineTo(-9,23);
 ctx.moveTo(6,14);ctx.lineTo(9,23);ctx.stroke();
 // 顔
 ctx.fillStyle=c.skin;
 ctx.beginPath();ctx.arc(0,-17,11,0,Math.PI*2);ctx.fill();
 // ひげ
 ctx.fillStyle="#fff0d5";
 ctx.beginPath();ctx.moveTo(-8,-13);ctx.lineTo(0,0);ctx.lineTo(9,-13);
 ctx.quadraticCurveTo(0,-8,-8,-13);ctx.fill();
 // 帽子
 ctx.fillStyle=c.hat;
 ctx.beginPath();ctx.moveTo(-13,-24);ctx.quadraticCurveTo(-12,-48,3,-50);
 ctx.quadraticCurveTo(12,-39,13,-24);ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff2ce";
 ctx.beginPath();ctx.arc(3,-49,3,0,Math.PI*2);ctx.fill();
 // 腕
 ctx.strokeStyle=c.coat;ctx.lineWidth=6;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(-10,-4);ctx.lineTo(-19,3);
 ctx.moveTo(10,-4);ctx.lineTo(19,3);ctx.stroke();
 ctx.restore();
}

function makeCharacters(){
 const box=$("characters");box.innerHTML="";
 people.forEach((p,i)=>{
  let el=document.createElement("div");
  el.className="character"+(i===selected?" selected":"");
  let cv=document.createElement("canvas");
  cv.width=100;cv.height=100;
  let c=cv.getContext("2d");
  drawGnome(p,50,70,1.15);
  el.appendChild(cv);
  let name=document.createElement("span");
  name.textContent=p.name;el.appendChild(name);
  el.onclick=()=>{selected=i;makeCharacters()};
  box.appendChild(el);
 });
}
makeCharacters();

function groundY(){return H*.77}

function makeScenery(){
 scenery=[];
 for(let i=0;i<35;i++){
  scenery.push({
   x:i*240+Math.random()*100,
   y:groundY()-30-Math.random()*100,
   size:35+Math.random()*65,
   type:Math.random()
  });
 }
 flowers=[];
 for(let i=0;i<90;i++){
  flowers.push({
   x:i*95+Math.random()*70,
   color:["#ff6386","#fff06b","#b98aff","#ffffff"][i%4],
   size:3+Math.random()*4
  });
 }
}
makeScenery();

function drawBackground(){
 let sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#65c5f0");
 sky.addColorStop(.72,"#d4eff2");
 sky.addColorStop(1,"#8bc66a");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 // 太陽
 ctx.fillStyle="#fff4b1";
 ctx.beginPath();ctx.arc(W*.82,H*.16,38,0,Math.PI*2);ctx.fill();

 // 雲
 for(let i=0;i<7;i++){
  let x=((i*210-camera*.18)%(W+300)+W+300)%(W+300)-100;
  let y=H*(.12+(i%3)*.12);
  ctx.fillStyle="#ffffffcc";
  ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);
  ctx.arc(x+28,y-10,30,0,Math.PI*2);
  ctx.arc(x+58,y,22,0,Math.PI*2);ctx.fill();
 }

 // 遠くの山
 ctx.fillStyle="#7ebd9b";
 ctx.beginPath();ctx.moveTo(0,H*.65);
 for(let x=0;x<=W+20;x+=20){
  ctx.lineTo(x,H*.55+Math.sin((x+camera*.12)*.012)*32);
 }
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

 // 木
 for(let i=0;i<scenery.length;i++){
  let t=scenery[i];
  let x=((t.x-camera*.48)%(W+300)+W+300)%(W+300)-100;
  let y=groundY()-35;
  ctx.fillStyle="#765039";
  ctx.fillRect(x-5,y-50,10,55);
  ctx.fillStyle="#367b43";
  ctx.beginPath();ctx.arc(x,y-65,t.size*.48,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#4c9850";
  ctx.beginPath();ctx.arc(x-15,y-76,t.size*.3,0,Math.PI*2);ctx.fill();
 }

 // 地面
 ctx.fillStyle="#71b84b";ctx.fillRect(0,groundY(),W,H-groundY());
 ctx.fillStyle="#4b943e";ctx.fillRect(0,groundY(),W,8);
 for(let f of flowers){
  let x=((f.x-camera)%(W+100)+W+100)%(W+100);
  if(x>W)continue;
  ctx.fillStyle=f.color;
  ctx.beginPath();ctx.arc(x,groundY()-3,f.size,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#397e36";
  ctx.fillRect(x,groundY(),1,8);
 }
}

function explosion(x,y,power=1){
 shake=12;
 for(let i=0;i<65;i++){
  let a=Math.random()*Math.PI*2;
  let v=(2+Math.random()*9)*power;
  particles.push({
   x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
   life:35+Math.random()*25,
   max:60,size:2+Math.random()*8,
   color:["#ffdf6b","#ff922e","#e84a20","#fff2d2"][i%4],
   smoke:false
  });
 }
 for(let i=0;i<24;i++){
  particles.push({
   x:x+(Math.random()-.5)*20,y:y+(Math.random()-.5)*20,
   vx:(Math.random()-.5)*3,vy:-Math.random()*4,
   life:65,max:65,size:10+Math.random()*15,
   color:"#9a9288",smoke:true
  });
 }
}

function startGame(){
 $("menu").classList.add("hidden");
 $("result").style.display="none";
 $("back").classList.remove("hidden");
 $("hint").textContent="画面をタップして発射！";
 state="ready";
 camera=0;distance=0;particles=[];
 player={x:W*.2,y:groundY()-45,vx:0,vy:0,angle:0,air:false,boost:0};
 plays++;
 localStorage.setItem("gnomePlays",plays);
 updateStats();
}

function launch(){
 if(state!=="ready")return;
 state="flight";
 player.air=true;
 player.vx=13;
 player.vy=-17;
 launchTime=performance.now();
 explosion(player.x-35,player.y+15,1.2);
 $("hint").textContent="タップで急降下！";
}

function finish(){
 if(state!=="flight")return;
 state="result";
 let score=Math.floor(distance);
 let record=score>best;
 if(record){
  best=score;
  localStorage.setItem("gnomeBest",best);
 }
 updateStats();
 $("finalDistance").textContent=score+" m";
 $("resultTitle").textContent=record?"🏆 新記録！":"着地！";
 $("recordMessage").textContent=record?"自己最高記録を更新した！":"最高記録："+best+" m";
 $("result").style.display="flex";
 $("hint").textContent="";
}

function tap(){
 if(state==="ready"){launch();return}
 if(state==="flight"){
  player.vy-=5;
  player.boost=12;
  for(let i=0;i<12;i++){
   particles.push({
    x:player.x,y:player.y+10,
    vx:(Math.random()-.5)*5,vy:Math.random()*4,
    life:20,max:20,size:4,
    color:"#ffe45c",smoke:false
   });
  }
 }
}
canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();tap();
});

function drawLauncher(){
 let x=W*.2,y=groundY()-45;
 // 台座
 ctx.fillStyle="#67452b";
 ctx.fillRect(x-42,y+17,85,17);
 ctx.fillStyle="#9b7045";
 ctx.fillRect(x-30,y+28,60,8);
 // 枠
 ctx.strokeStyle="#684327";ctx.lineWidth=9;
 ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(x-22,y+12);ctx.lineTo(x-28,y-70);
 ctx.moveTo(x+22,y+12);ctx.lineTo(x+28,y-70);ctx.stroke();
 // ゴム
 ctx.strokeStyle="#3f2921";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(x-28,y-70);
 ctx.lineTo(x,y-30);ctx.lineTo(x+28,y-70);ctx.stroke();
 drawGnome(people[selected],x,y-25,.85);
}

function update(dt){
 if(state==="flight"){
  let p=player;
  let boost=p.boost>0?1.12:1;
  p.boost=Math.max(0,p.boost-dt);
  p.vy+=.43*dt;
  p.vx*=Math.pow(.998,dt);
  p.x+=p.vx*dt*boost;
  p.y+=p.vy*dt;
  p.angle=Math.atan2(p.vy,p.vx);
  if(p.y>groundY()-18){
   p.y=groundY()-18;
   if(Math.abs(p.vx)>2){
    p.vy=-Math.abs(p.vy)*.48;
    p.vx*=.78;
    explosion(p.x,p.y,.3);
   }else finish();
  }
  camera=Math.max(0,p.x-W*.27);
  distance=Math.max(0,Math.floor(camera/10));
  $("distance").textContent=distance+" m";
  if(p.x-camera>W+50)camera=p.x-W*.5;
  if(p.vx<.5&&p.y>=groundY()-19)finish();
  if(performance.now()-launchTime>25000)finish();
 }
 particles=particles.filter(p=>p.life>0);
 for(let p of particles){
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vy+=p.smoke?-.025:.12;
  p.vx*=.98;p.life-=dt;
  if(p.smoke)p.size+=.16*dt;
 }
 shake*=Math.pow(.88,dt);
}

function drawParticles(){
 for(let p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.max);
  ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x-camera,p.y,p.size,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}

function draw(){
 ctx.save();
 if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 drawBackground();

 if(state==="ready")drawLauncher();

 if(state==="flight"||state==="result"){
  if(player){
   drawGnome(people[selected],player.x-camera,player.y,.95,player.angle);
  }
 }
 drawParticles();
 ctx.restore();
}

function loop(t){
 let dt=Math.min((t-last)/16.67||1,2);
 last=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$("start").onclick=startGame;
$("again").onclick=startGame;
$("toMenu").onclick=()=>{
 state="menu";
 $("result").style.display="none";
 $("menu").classList.remove("hidden");
 $("back").classList.add("hidden");
 $("hint").textContent="";
 makeCharacters();
};
$("back").onclick=()=>{
 if(state==="flight"||state==="ready"){
  state="menu";
  $("menu").classList.remove("hidden");
  $("back").classList.add("hidden");
  $("hint").textContent="";
 }
};

addEventListener("keydown",e=>{
 if(e.code==="Space"){
  e.preventDefault();tap();
 }
});
</script>
</body>
</html>
