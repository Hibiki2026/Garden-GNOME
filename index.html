
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Garden Gnome</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101c2b;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100dvh;background:#8bd5ed;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 5px #234;font-weight:bold}
.panel{background:#142638bb;padding:9px 13px;border-radius:12px}
#chargeWrap{position:fixed;bottom:24px;left:10%;width:80%;height:17px;border:2px solid white;border-radius:20px;background:#2238;overflow:hidden;pointer-events:none}
#charge{height:100%;width:0;background:linear-gradient(90deg,#5de5ff,#ffe45d,#ff713e);border-radius:20px}
#message{position:fixed;bottom:55px;width:100%;text-align:center;text-shadow:0 2px 5px #234;font-weight:bold;pointer-events:none}
#menu{position:fixed;inset:0;background:#102538ee;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#menu h1{font-size:34px;margin:0}
#characters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.char{font-size:32px;padding:12px;border:2px solid #789;border-radius:14px;background:#ffffff18}
.char.selected{border-color:#ffe45d;background:#ffe45d33}
button{border:0;border-radius:13px;padding:13px 25px;background:#ffd84d;color:#243044;font-weight:bold;font-size:17px}
.small{font-size:13px;color:#c7d8e5}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="panel">距離 <span id="distance">0</span> m<br>最高記録 <span id="best">0</span> m</div>
 <div class="panel">プレイ回数 <span id="plays">0</span><br><span id="world">🌳 地上</span></div>
</div>
<div id="message">画面を長押ししてパワーをためよう！</div>
<div id="chargeWrap"><div id="charge"></div></div>
<div id="menu">
 <h1>🍄 Garden Gnome</h1>
 <div>ノームを選ぼう！</div>
 <div id="characters">
  <button class="char selected" data-char="0">🧙</button>
  <button class="char" data-char="1">🧝</button>
  <button class="char" data-char="2">🎅</button>
  <button class="char" data-char="3">🧑‍🌾</button>
  <button class="char" data-char="4">🧙‍♂️</button>
 </div>
 <div class="small">画面を長押しして発射！長いほど遠くへ飛ぶ！</div>
 <button id="start">ゲームスタート</button>
 <div class="small">キーボード：スペースキーでも操作できるよ</div>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

const emojis=["🧙","🧝","🎅","🧑‍🌾","🧙‍♂️"];
let selected=0;
document.querySelectorAll(".char").forEach(b=>b.onclick=()=>{
 selected=+b.dataset.char;
 document.querySelectorAll(".char").forEach(x=>x.classList.toggle("selected",x===b));
});

let best=+(localStorage.gnomeBest||0),plays=+(localStorage.gnomePlays||0);
document.getElementById("best").textContent=best;
document.getElementById("plays").textContent=plays;

let player,objects=[],particles=[],cameraX=0,cameraY=0;
let playing=false,charging=false,charge=0,last=0,space=false;
let distance=0,cloudTime=0,megaBoost=0,groundY=0;
const rand=(a,b)=>a+Math.random()*(b-a);

function reset(){
 groundY=H*.76;
 player={x:100,y:groundY-30,vx:0,vy:0,angle:0,launched:false};
 objects=[];particles=[];cameraX=0;cameraY=0;
 distance=0;cloudTime=0;megaBoost=0;space=false;
 for(let i=0;i<90;i++){
  let x=rand(260,15000);
  let mega=(i+1)%5===0;
  objects.push({x,y:groundY-rand(5,35),type:mega?"mega":"mush",r:mega?30:rand(13,20),hit:false});
 }
 for(let i=0;i<28;i++){
  objects.push({x:rand(500,14000),y:groundY-rand(H*1.05,H*2.3),type:"cloud",r:rand(45,85),hit:false});
 }
 objects.sort((a,b)=>a.x-b.x);
}

function start(){
 document.getElementById("menu").style.display="none";
 plays++;localStorage.gnomePlays=plays;
 document.getElementById("plays").textContent=plays;
 reset();playing=true;last=performance.now();
 requestAnimationFrame(loop);
}

document.getElementById("start").onclick=start;

function beginCharge(){if(!playing||player.launched)return;charging=true;charge=0}
function releaseCharge(){
 if(!charging||!playing||player.launched)return;
 charging=false;
 let power=Math.min(charge,1);
 player.vx=8+power*15;
 player.vy=-7-power*10;
 player.launched=true;
 burst(player.x,player.y,20,"#fff1a6");
 document.getElementById("message").textContent="飛んでいるよ！";
}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();beginCharge()});
addEventListener("pointerup",releaseCharge);
addEventListener("pointercancel",releaseCharge);
let keyDown=false;
addEventListener("keydown",e=>{if(e.code==="Space"&&!keyDown){e.preventDefault();keyDown=true;beginCharge()}});
addEventListener("keyup",e=>{if(e.code==="Space"){keyDown=false;releaseCharge()}});

function burst(x,y,n,color){
 for(let i=0;i<n;i++){
  let a=rand(0,Math.PI*2),s=rand(2,10);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(25,55),color,size:rand(3,8)});
 }
}
function cloudBurst(x,y){
 burst(x,y,45,"#ffffff");
 for(let i=0;i<18;i++)particles.push({x:x+rand(-30,30),y:y+rand(-15,15),vx:rand(-3,3),vy:rand(-5,-1),life:60,color:"#b8efff",size:rand(8,17)});
}

function update(dt){
 if(charging&&!player.launched){
  charge=Math.min(1,charge+dt*.00035);
  document.getElementById("charge").style.width=(charge*100)+"%";
 }
 if(!player.launched)return;
 let p=player;
 p.vy+=.34*dt/16.67;
 if(cloudTime>0){p.vy-=.25*dt/16.67;cloudTime-=dt}
 p.x+=p.vx*dt/16.67;
 p.y+=p.vy*dt/16.67;
 p.vx*=Math.pow(.998,dt/16.67);
 p.angle=Math.atan2(p.vy,p.vx);
 for(const o of objects){
  if(o.hit)continue;
  let dx=p.x-o.x,dy=p.y-o.y;
  if(Math.hypot(dx,dy)<o.r+19){
   o.hit=true;
   if(o.type==="mega"){
    megaBoost=1;
    p.vx*=1.42;p.vy=-Math.max(17,Math.abs(p.vy)*1.6);
    burst(o.x,o.y,100,"#ffd43b");
    burst(o.x,o.y,55,"#fff");
    document.getElementById("message").textContent="⭐ MEGA MUSHROOM!!";
   }else if(o.type==="mush"){
    p.vy-=3.2;p.vx+=1.1;
    burst(o.x,o.y,18,"#ff6584");
   }else if(o.type==="cloud"){
    cloudTime=2600;
    p.vy=Math.min(p.vy,-2);
    cloudBurst(o.x,o.y);
    document.getElementById("message").textContent="☁️ 雲の上をふわふわ飛行！";
   }
  }
 }
 if(p.y>groundY-22&&p.x>150){
  p.y=groundY-22;
  p.vy=-Math.abs(p.vy)*.48;
  p.vx*=.78;
 }
 cameraX=Math.max(0,p.x-W*.34);
 cameraY=p.y-H*.48;
 distance=Math.max(0,Math.floor(p.x/10));
 document.getElementById("distance").textContent=distance;
 let isSpace=(groundY-p.y)>H*3;
 if(isSpace!==space){
  space=isSpace;
  document.getElementById("world").textContent=space?"🚀 宇宙":"🌳 地上";
 }
 if(p.x>best*10){
  best=Math.floor(p.x/10);
  localStorage.gnomeBest=best;
  document.getElementById("best").textContent=best;
 }
 if(p.x>16000||p.y>groundY+1000||p.vx<.15&&Math.abs(p.vy)<.5){
  finish();
 }
}

function finish(){
 playing=false;charging=false;
 document.getElementById("charge").style.width="0%";
 document.getElementById("message").textContent="記録 "+distance+" m！";
 setTimeout(()=>{document.getElementById("menu").style.display="flex";document.getElementById("message").textContent="画面を長押ししてパワーをためよう！"},1300);
}

function drawBackground(){
 if(space){
  ctx.fillStyle="#080c2c";ctx.fillRect(0,0,W,H);
  for(let i=0;i<100;i++){
   let x=((i*173-cameraX*.12)%W+W)%W;
   let y=((i*97-cameraY*.1)%H+H)%H;
   ctx.fillStyle=i%4===0?"#ffe88a":"#fff";
   ctx.globalAlpha=.4+(i%5)*.12;
   ctx.fillRect(x,y,2,2);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#a9b8ff";ctx.beginPath();ctx.arc(W*.78,H*.2,35,0,Math.PI*2);ctx.fill();
 }else{
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#69c6ee");g.addColorStop(1,"#e2f7d4");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){
   let x=((i*260-cameraX*.25)% (W+300)+W+300)%(W+300)-100;
   ctx.fillStyle="#ffffff66";
   ctx.beginPath();ctx.arc(x,100+i%3*75,35,0,Math.PI*2);ctx.arc(x+35,95+i%3*75,45,0,Math.PI*2);ctx.arc(x+75,110+i%3*75,30,0,Math.PI*2);ctx.fill();
  }
 }
}

function drawWorld(){
 let gy=groundY-cameraY;
 if(gy<H+100&&gy>-100){
  ctx.fillStyle=space?"#30334b":"#4b9a46";
  ctx.fillRect(0,gy,W,H-gy+200);
  ctx.fillStyle=space?"#8588a0":"#8bcf5d";
  ctx.fillRect(0,gy,W,8);
 }
 for(const o of objects){
  let x=o.x-cameraX,y=o.y-cameraY;
  if(x<-120||x>W+120||y<-150||y>H+150||o.hit)continue;
  if(o.type==="cloud"){
   ctx.fillStyle="#ffffffcc";
   ctx.beginPath();ctx.arc(x,y, o.r*.55,0,Math.PI*2);ctx.arc(x-o.r*.4,y+8,o.r*.4,0,Math.PI*2);ctx.arc(x+o.r*.4,y+7,o.r*.42,0,Math.PI*2);ctx.fill();
  }else if(o.type==="mega"){
   ctx.shadowColor="#ffe34e";ctx.shadowBlur=25;
   ctx.fillStyle="#ffda35";ctx.beginPath();ctx.arc(x,y,o.r,0,Math.PI*2);ctx.fill();
   ctx.shadowBlur=0;
   ctx.fillStyle="#b84739";ctx.beginPath();ctx.arc(x,y-8,o.r*.85,Math.PI,Math.PI*2);ctx.fill();
   ctx.fillStyle="white";ctx.font="22px Arial";ctx.textAlign="center";ctx.fillText("⭐",x,y+9);
  }else{
   ctx.fillStyle="#f7e5d2";ctx.fillRect(x-5,y+5,10,12);
   ctx.fillStyle="#ed4564";ctx.beginPath();ctx.arc(x,y, o.r,Math.PI,Math.PI*2);ctx.fill();
   ctx.fillStyle="white";for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(x-7+j*7,y-8,2.5,0,Math.PI*2);ctx.fill()}
  }
 }
}

function drawPlayer(){
 if(!player)return;
 let x=player.x-cameraX,y=player.y-cameraY;
 ctx.save();ctx.translate(x,y);ctx.rotate(player.angle*.45);
 ctx.font="42px serif";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(emojis[selected],0,0);
 ctx.restore();
}
function drawParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];p.x+=p.vx*dt/16.67;p.y+=p.vy*dt/16.67;p.vy+=.12*dt/16.67;p.life-=dt/16.67;
  ctx.globalAlpha=Math.max(0,p.life/55);ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x-cameraX,p.y-cameraY,p.size,0,Math.PI*2);ctx.fill();
  if(p.life<=0)particles.splice(i,1);
 }
 ctx.globalAlpha=1;
}
function render(dt){
 drawBackground();drawWorld();drawParticles(dt);drawPlayer();
}
function loop(now){
 if(!playing)return;
 let dt=Math.min(35,now-last||16);last=now;
 update(dt);render(dt);
 requestAnimationFrame(loop);
}
render(16);
</script>
</body>
</html>
